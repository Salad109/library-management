spring:
  application:
    name: library-management
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 4
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    mapper:
      sort-properties-alphabetically: false
  web:
    locale: en
    locale-resolver: fixed
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
server:
  servlet:
    session:
      cookie:
        same-site: lax
springdoc:
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    csrf:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
logging:
  level:
    root: WARN
    librarymanagement: INFO
library:
  admin:
    # First librarian, created at startup only if no librarian exist
    email: ${LIBRARY_ADMIN_EMAIL:}
    password: ${LIBRARY_ADMIN_PASSWORD:}
  reservations:
    # Reserved copies one customer can hold at once
    max-active: 3
    # Days a reserved copy is held for pick-up
    hold-days: 3
    max-extensions: 1
    # How often expired reservations are released
    expiry-cron: "0 * * * * *"
  loans:
    # Days until a checked-out copy is due
    period-days: 28

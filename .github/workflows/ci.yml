name: CI

on: [ push ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - run: ./mvnw verify

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml

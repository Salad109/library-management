name: library-management

services:
  library-management-app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - library-management-app

  loki:
    image: grafana/loki:3.7.9
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_LOG_LEVEL=warn
    depends_on:
      - prometheus
      - loki

  # Simulated users. Opt-in: docker compose --profile simulator up -d
  simulator:
    image: python:3.14-alpine
    profiles: [simulator]
    env_file: .env
    environment:
      - SIMULATOR_BASE_URL=http://library-management-app:8080
      - SIMULATOR_SPEED=${SIMULATOR_SPEED:-1}
    volumes:
      - ./simulator:/simulator:ro
    command: python /simulator/simulate.py
    depends_on:
      - library-management-app

volumes:
  db_data:
  grafana_data:
  loki_data:
